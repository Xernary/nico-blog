languageCode = "en-us"
title = "Nico's Security Research"
theme = "PaperMod"

[author]
  name = "Nico"

[params]
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowToc = true
  TocOpen = true
  ShowReadingTime = true
  customCSS = ["css/extended/custom.css"]
  hideFooter = false
  author = "Nico"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

[markup]
  [markup.highlight]
    style = "github-dark"
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params.assets]
  favicon = "favicon.ico"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"

